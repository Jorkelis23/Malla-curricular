<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malla Curricular Interactiva - Medicina</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Malla Curricular de Medicina</h1>
        <p>Haz clic en un ramo para marcarlo como aprobado. Tu progreso se guardará automáticamente.</p>
    </header>

    <main id="malla-curricular" class="malla-container">
        </main>
    
    <div id="mensaje-requisitos" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Requisitos Faltantes</h2>
            <p>Para aprobar este ramo, primero debes cursar y aprobar:</p>
            <ul id="lista-requisitos-faltantes">
                </ul>
        </div>
    </div>
    
    <div id="mensaje-motivacional" class="mensaje-motivacional">
        <p>¡LO ESTÁS LOGRANDO! 🎉 KEEP GOING! 💪</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
